name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'        # new questions only need a sync, not a new app build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        continue-on-error: true   # the build machine already has the Android tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Tell the app its repository and build number
        run: |
          echo "const CONFIG = { repo: '${{ github.repository }}', build: ${{ github.run_number }} };" > app/src/main/assets/config.js
      - name: Make launcher icons from logo.png
        run: |
          pip install pillow
          python3 tools/make_icons.py
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk al-streak.apk
          { echo "build: ${{ github.run_number }}"; echo; cat whatsnew.md; } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest al-streak.apk --title "A/L Streak build ${{ github.run_number }}" --notes-file notes.md
