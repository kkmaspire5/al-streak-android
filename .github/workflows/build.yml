name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Make launcher icons from logo.png
        run: |
          pip install pillow
          python3 tools/make_icons.py
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk al-streak.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest al-streak.apk --title "A/L Streak (latest)" --notes "Download al-streak.apk and install it."
